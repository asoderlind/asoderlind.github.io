---
layout: default
---

<article>
  <h1 class="page-title">{{ page.title }}</h1>

  <div class="post-meta">
    {% if page.date %}
      <div>{{ page.date | date: "%B %-d, %Y" }}</div>
    {% endif %}
    {% if page.categories.size > 0 %}
      <div class="post-categories">Categories: {% for category in page.categories %}<a href="{{ '/categories/' | relative_url }}#category-{{ category | slugify: 'default' }}">{{ category | escape }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}</div>
    {% endif %}
  </div>

  {{ content }}
</article>
